<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="100%" stop-color="#110e1b" />
    </linearGradient>

    <linearGradient id="trackpadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d283e" />
      <stop offset="100%" stop-color="#231f32" />
    </linearGradient>

    <linearGradient id="fingerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8d0f2" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a092c8" stop-opacity="0.20" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Title & Subtitle -->
  <text x="300" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Corner Zone Force Click</text>
  <text x="300" y="58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#a099bc" text-anchor="middle">Independent Deep-Press Actions in Configurable Corner Zones</text>

  <!-- Trackpad Surface -->
  <rect x="100" y="75" width="400" height="250" rx="14" fill="url(#trackpadGrad)" stroke="#453e59" stroke-width="2" filter="url(#shadow)" />

  <!-- Active Top-Left Corner Zone -->
  <rect x="108" y="83" width="180" height="150" rx="10" fill="#c7bde7" fill-opacity="0.08" stroke="#c7bde7" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.8" />
  
  <!-- Zone Header Badge -->
  <rect x="120" y="93" width="114" height="20" rx="10" fill="#2d283e" stroke="#c7bde7" stroke-width="1" opacity="0.9" />
  <text x="177" y="107" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#c7bde7" text-anchor="middle">Top-Left Zone</text>

  <!-- Passive Other Corner Zones for Context -->
  <!-- Top-Right Zone -->
  <rect x="362" y="83" width="130" height="70" rx="10" fill="#1e1b2e" fill-opacity="0.4" stroke="#453e59" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6" />
  <text x="427" y="122" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" opacity="0.7" text-anchor="middle">Top-Right Zone</text>

  <!-- Bottom-Right Zone -->
  <rect x="362" y="197" width="130" height="70" rx="10" fill="#1e1b2e" fill-opacity="0.4" stroke="#453e59" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6" />
  <text x="427" y="236" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" opacity="0.7" text-anchor="middle">Bottom-Right Zone</text>

  <!-- 3 Fingers Deep Press inside Top-Left Zone -->
  <!-- Index (cx=156, cy=155) -->
  <g class="finger">
    <path d="M 145 167 C 145 155, 167 155, 167 167 L 170 220 L 142 220 Z"
          fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 149.4 171 C 149.4 163, 162.6 163, 162.6 171 Z"
          fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />
    <circle cx="156" cy="155" r="11" fill="#c7bde7" opacity="0.95" />
    <circle cx="156" cy="155" r="18" fill="none" stroke="#c7bde7" stroke-width="2" opacity="0.75" />
  </g>

  <!-- Middle (cx=196, cy=145) -->
  <g class="finger">
    <path d="M 185 157 C 185 145, 207 145, 207 157 L 210 210 L 182 210 Z"
          fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 189.4 161 C 189.4 153, 202.6 153, 202.6 161 Z"
          fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />
    <circle cx="196" cy="145" r="11" fill="#c7bde7" opacity="0.95" />
    <circle cx="196" cy="145" r="18" fill="none" stroke="#c7bde7" stroke-width="2" opacity="0.75" />
    <circle cx="196" cy="145" r="24" fill="none" stroke="#c7bde7" stroke-width="2" stroke-dasharray="3 3" opacity="0.4" />
  </g>

  <!-- Ring (cx=236, cy=155) -->
  <g class="finger">
    <path d="M 225 167 C 225 155, 247 155, 247 167 L 250 220 L 222 220 Z"
          fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 229.4 171 C 229.4 163, 242.6 163, 242.6 171 Z"
          fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />
    <circle cx="236" cy="155" r="11" fill="#c7bde7" opacity="0.95" />
    <circle cx="236" cy="155" r="18" fill="none" stroke="#c7bde7" stroke-width="2" opacity="0.75" />
  </g>

  <!-- Action Callout Arrow to Top-Left Zone -->
  <g transform="translate(196, 122)" stroke="#c7bde7" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <line x1="0" y1="-8" x2="0" y2="4" />
    <polyline points="-4,0 0,4 4,0" fill="none" />
  </g>

  <!-- Bottom Caption -->
  <text x="300" y="306" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#c7bde7" text-anchor="middle">Corner Force Click: Deep press in corner for shortcuts</text>

</svg>
