<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="100%" stop-color="#110e1b" />
    </linearGradient>

    <linearGradient id="trackpadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d283e" />
      <stop offset="100%" stop-color="#231f32" />
    </linearGradient>

    <linearGradient id="fingerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8d0f2" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a092c8" stop-opacity="0.20" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Title & Subtitle -->
  <text x="300" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Swipe Right</text>
  <text x="300" y="58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#a099bc" text-anchor="middle">Horizontal Rightward Gesture with Finger Silhouettes</text>

  <!-- Trackpad Surface -->
  <rect x="100" y="75" width="400" height="250" rx="14" fill="url(#trackpadGrad)" stroke="#453e59" stroke-width="2" filter="url(#shadow)" />

  <g class="finger">
      <!-- Finger Body Silhouette -->
      <path d="M 199 202
               C 199 190, 221 190, 221 202
               L 224 280
               L 196 280 Z"
            fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />

      <!-- Fingernail Detail -->
      <path d="M 203.4 206 C 203.4 198, 216.6 198, 216.6 206 Z"
            fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />

      <!-- Touch Point Touch Circle & Ripple -->
      <circle cx="210" cy="190" r="12" fill="#c7bde7" opacity="0.9" />
      <circle cx="210" cy="190" r="20" fill="none" stroke="#c7bde7" stroke-width="1.5" opacity="0.4" />
    </g>
<text x="210" y="295" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" text-anchor="middle">Index</text>
<g class="finger">
      <!-- Finger Body Silhouette -->
      <path d="M 229 192
               C 229 180, 251 180, 251 192
               L 254 270
               L 226 270 Z"
            fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />

      <!-- Fingernail Detail -->
      <path d="M 233.4 196 C 233.4 188, 246.6 188, 246.6 196 Z"
            fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />

      <!-- Touch Point Touch Circle & Ripple -->
      <circle cx="240" cy="180" r="12" fill="#c7bde7" opacity="0.9" />
      <circle cx="240" cy="180" r="20" fill="none" stroke="#c7bde7" stroke-width="1.5" opacity="0.4" />
    </g>
<text x="240" y="285" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" text-anchor="middle">Middle</text>
<g class="finger">
      <!-- Finger Body Silhouette -->
      <path d="M 259 202
               C 259 190, 281 190, 281 202
               L 284 280
               L 256 280 Z"
            fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />

      <!-- Fingernail Detail -->
      <path d="M 263.4 206 C 263.4 198, 276.6 198, 276.6 206 Z"
            fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />

      <!-- Touch Point Touch Circle & Ripple -->
      <circle cx="270" cy="190" r="12" fill="#c7bde7" opacity="0.9" />
      <circle cx="270" cy="190" r="20" fill="none" stroke="#c7bde7" stroke-width="1.5" opacity="0.4" />
    </g>
<text x="270" y="295" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" text-anchor="middle">Ring</text>

    <g stroke="#c7bde7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 290 185 L 390 185" />
      <path d="M 375 170 L 390 185 L 375 200" />
    </g>
    <text x="300" y="305" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#c7bde7" text-anchor="middle">Swipe Right: Smooth rightward finger motion</text>

</svg>