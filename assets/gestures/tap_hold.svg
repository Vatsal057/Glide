<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="100%" stop-color="#110e1b" />
    </linearGradient>

    <linearGradient id="trackpadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d283e" />
      <stop offset="100%" stop-color="#231f32" />
    </linearGradient>

    <linearGradient id="fingerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8d0f2" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a092c8" stop-opacity="0.20" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Title & Subtitle -->
  <text x="300" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Tap &amp; Hold Gesture</text>
  <text x="300" y="58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#a099bc" text-anchor="middle">Motionless Finger Hold with Finger Silhouettes</text>

  <!-- Trackpad Surface -->
  <rect x="100" y="75" width="400" height="250" rx="14" fill="url(#trackpadGrad)" stroke="#453e59" stroke-width="2" filter="url(#shadow)" />

  <!-- Calm Motionless Boundary -->
  <rect x="210" y="142" width="180" height="66" rx="33" fill="#c7bde7" fill-opacity="0.05" stroke="#c7bde7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5" />

  <!-- Hold Duration Timer Badge -->
  <g transform="translate(300, 122)">
    <rect x="-48" y="-12" width="96" height="22" rx="11" fill="#2d283e" stroke="#c7bde7" stroke-width="1.2" opacity="0.9" />
    <!-- Mini clock icon -->
    <circle cx="-32" cy="-1" r="5.5" fill="none" stroke="#c7bde7" stroke-width="1.2" />
    <path d="M -32 -4 L -32 -1 L -29 -1" fill="none" stroke="#c7bde7" stroke-width="1.2" stroke-linecap="round" />
    <text x="-21" y="3" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#c7bde7" text-anchor="start">Hold ~0.5s</text>
  </g>

  <!-- Index Finger -->
  <g class="finger">
    <path d="M 239 192
             C 239 180, 261 180, 261 192
             L 264 260
             L 236 260 Z"
          fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 243.4 196 C 243.4 188, 256.6 188, 256.6 196 Z"
          fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />

    <!-- Touch Point -->
    <circle cx="250" cy="180" r="12" fill="#c7bde7" opacity="0.9" />
    <!-- Progress Timer Arc -->
    <circle cx="250" cy="180" r="22" fill="none" stroke="#c7bde7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="105 35" opacity="0.8" />
  </g>
  <text x="250" y="276" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" text-anchor="middle">Index</text>

  <!-- Middle Finger -->
  <g class="finger">
    <path d="M 289 182
             C 289 170, 311 170, 311 182
             L 314 250
             L 286 250 Z"
          fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 293.4 186 C 293.4 178, 306.6 178, 306.6 186 Z"
          fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />

    <!-- Touch Point -->
    <circle cx="300" cy="170" r="12" fill="#c7bde7" opacity="0.9" />
    <!-- Progress Timer Arc -->
    <circle cx="300" cy="170" r="22" fill="none" stroke="#c7bde7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="105 35" opacity="0.8" />
  </g>
  <text x="300" y="266" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" text-anchor="middle">Middle</text>

  <!-- Ring Finger -->
  <g class="finger">
    <path d="M 339 192
             C 339 180, 361 180, 361 192
             L 364 260
             L 336 260 Z"
          fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 343.4 196 C 343.4 188, 356.6 188, 356.6 196 Z"
          fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />

    <!-- Touch Point -->
    <circle cx="350" cy="180" r="12" fill="#c7bde7" opacity="0.9" />
    <!-- Progress Timer Arc -->
    <circle cx="350" cy="180" r="22" fill="none" stroke="#c7bde7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="105 35" opacity="0.8" />
  </g>
  <text x="350" y="276" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" text-anchor="middle">Ring</text>

  <!-- Bottom Caption -->
  <text x="300" y="306" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#c7bde7" text-anchor="middle">Tap &amp; Hold: Rest fingers motionless (~0.5s)</text>

</svg>