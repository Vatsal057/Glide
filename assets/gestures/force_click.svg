<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="100%" stop-color="#110e1b" />
    </linearGradient>

    <linearGradient id="trackpadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d283e" />
      <stop offset="100%" stop-color="#231f32" />
    </linearGradient>

    <linearGradient id="fingerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8d0f2" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a092c8" stop-opacity="0.20" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Title & Subtitle -->
  <text x="300" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Force Click Gesture</text>
  <text x="300" y="58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#a099bc" text-anchor="middle">Deep Force Touch Press Past Standard Click</text>

  <!-- Trackpad Surface -->
  <rect x="100" y="75" width="400" height="250" rx="14" fill="url(#trackpadGrad)" stroke="#453e59" stroke-width="2" filter="url(#shadow)" />

  <!-- Downward Pressure Vectors -->
  <g stroke="#c7bde7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Index downward arrow -->
    <path d="M 250 132 L 250 152" />
    <path d="M 245 146 L 250 152 L 255 146" />
    <!-- Middle downward arrow -->
    <path d="M 300 122 L 300 142" />
    <path d="M 295 136 L 300 142 L 305 136" />
    <!-- Ring downward arrow -->
    <path d="M 350 132 L 350 152" />
    <path d="M 345 146 L 350 152 L 355 146" />
  </g>

  <!-- Multi-Stage Deep Pressure Rings & Haptic Bursts -->
  <!-- Outer Shockwave connecting all fingers -->
  <ellipse cx="300" cy="175" rx="80" ry="46" fill="none" stroke="#c7bde7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45" />

  <!-- Index Finger -->
  <g class="finger">
    <path d="M 239 192
             C 239 180, 261 180, 261 192
             L 264 260
             L 236 260 Z"
          fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 243.4 196 C 243.4 188, 256.6 188, 256.6 196 Z"
          fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />

    <!-- Deep Pressure Rings -->
    <circle cx="250" cy="180" r="13" fill="#c7bde7" opacity="0.95" />
    <circle cx="250" cy="180" r="21" fill="none" stroke="#c7bde7" stroke-width="2" opacity="0.75" />
    <circle cx="250" cy="180" r="28" fill="none" stroke="#c7bde7" stroke-width="2.5" opacity="0.4" />
  </g>
  <text x="250" y="276" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" text-anchor="middle">Index</text>

  <!-- Middle Finger -->
  <g class="finger">
    <path d="M 289 182
             C 289 170, 311 170, 311 182
             L 314 250
             L 286 250 Z"
          fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 293.4 186 C 293.4 178, 306.6 178, 306.6 186 Z"
          fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />

    <!-- Deep Pressure Rings -->
    <circle cx="300" cy="170" r="13" fill="#c7bde7" opacity="0.95" />
    <circle cx="300" cy="170" r="21" fill="none" stroke="#c7bde7" stroke-width="2" opacity="0.75" />
    <circle cx="300" cy="170" r="28" fill="none" stroke="#c7bde7" stroke-width="2.5" opacity="0.4" />
  </g>
  <text x="300" y="266" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" text-anchor="middle">Middle</text>

  <!-- Ring Finger -->
  <g class="finger">
    <path d="M 339 192
             C 339 180, 361 180, 361 192
             L 364 260
             L 336 260 Z"
          fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 343.4 196 C 343.4 188, 356.6 188, 356.6 196 Z"
          fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />

    <!-- Deep Pressure Rings -->
    <circle cx="350" cy="180" r="13" fill="#c7bde7" opacity="0.95" />
    <circle cx="350" cy="180" r="21" fill="none" stroke="#c7bde7" stroke-width="2" opacity="0.75" />
    <circle cx="350" cy="180" r="28" fill="none" stroke="#c7bde7" stroke-width="2.5" opacity="0.4" />
  </g>
  <text x="350" y="276" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" text-anchor="middle">Ring</text>

  <!-- Bottom Caption -->
  <text x="300" y="306" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#c7bde7" text-anchor="middle">Force Click: Deep press past standard click threshold</text>

</svg>