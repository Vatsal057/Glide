<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="100%" stop-color="#110e1b" />
    </linearGradient>

    <linearGradient id="trackpadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d283e" />
      <stop offset="100%" stop-color="#231f32" />
    </linearGradient>

    <linearGradient id="fingerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8d0f2" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a092c8" stop-opacity="0.20" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Title & Subtitle -->
  <text x="300" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">TrackPoint: Double-Tap &amp; Hold</text>
  <text x="300" y="58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#a099bc" text-anchor="middle">Pointing Stick Activation with Finger Silhouettes</text>

  <!-- Trackpad Surface -->
  <rect x="100" y="75" width="400" height="250" rx="14" fill="url(#trackpadGrad)" stroke="#453e59" stroke-width="2" filter="url(#shadow)" />

  <!-- Step 1: Quick Tap -->
  <g class="step1">
    <!-- Tap & Lift Motion Indicator -->
    <g stroke="#c7bde7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M 220 146 L 220 130" />
      <path d="M 215 136 L 220 130 L 225 136" />
    </g>

    <!-- Finger Body Silhouette -->
    <path d="M 209 182
             C 209 170, 231 170, 231 182
             L 234 248
             L 206 248 Z"
          fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Fingernail Detail -->
    <path d="M 213.4 186 C 213.4 178, 226.6 178, 226.6 186 Z"
          fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />

    <!-- Quick Tap Touch Point & Ripple -->
    <circle cx="220" cy="170" r="12" fill="#c7bde7" opacity="0.9" />
    <circle cx="220" cy="170" r="20" fill="none" stroke="#c7bde7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />

    <!-- Step 1 Badge -->
    <rect x="178" y="256" width="84" height="22" rx="11" fill="#2d283e" stroke="#c7bde7" stroke-width="1.2" opacity="0.9" />
    <text x="220" y="271" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#c7bde7" text-anchor="middle">1. Quick Tap</text>
  </g>

  <!-- Double-Tap Flow Connector -->
  <g class="connector">
    <path d="M 242 152 Q 300 118 354 148" fill="none" stroke="#a099bc" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.85" />
    <polygon points="356,150 346,145 350,154" fill="#a099bc" opacity="0.85" />
    <text x="300" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#a099bc" text-anchor="middle">Tap Again</text>
  </g>

  <!-- Step 2: Hold & Steer (TrackPoint Hub) -->
  <g class="step2">
    <!-- Omnidirectional Velocity Arrows -->
    <g stroke="#c7bde7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <!-- Up Arrow -->
      <path d="M 380 140 L 380 120" />
      <path d="M 375 126 L 380 120 L 385 126" />
      <!-- Down Arrow -->
      <path d="M 380 200 L 380 220" />
      <path d="M 375 214 L 380 220 L 385 214" />
      <!-- Left Arrow -->
      <path d="M 350 170 L 330 170" />
      <path d="M 336 165 L 330 170 L 336 175" />
      <!-- Right Arrow -->
      <path d="M 410 170 L 430 170" />
      <path d="M 424 165 L 430 170 L 424 175" />
    </g>

    <!-- Finger Body Silhouette -->
    <path d="M 369 182
             C 369 170, 391 170, 391 182
             L 394 248
             L 366 248 Z"
          fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Fingernail Detail -->
    <path d="M 373.4 186 C 373.4 178, 386.6 178, 386.6 186 Z"
          fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />

    <!-- TrackPoint Anchor Point & Active Rings -->
    <circle cx="380" cy="170" r="13" fill="#c7bde7" opacity="0.95" />
    <circle cx="380" cy="170" r="22" fill="none" stroke="#c7bde7" stroke-width="2" opacity="0.75" />
    <circle cx="380" cy="170" r="30" fill="none" stroke="#c7bde7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4" />

    <!-- Step 2 Badge -->
    <rect x="334" y="256" width="92" height="22" rx="11" fill="#2d283e" stroke="#c7bde7" stroke-width="1.2" opacity="0.9" />
    <text x="380" y="271" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#c7bde7" text-anchor="middle">2. Hold &amp; Steer</text>
  </g>

  <!-- Bottom Caption -->
  <text x="300" y="306" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#c7bde7" text-anchor="middle">TrackPoint: Tap once, tap again &amp; hold to steer cursor</text>

</svg>