<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="100%" stop-color="#110e1b" />
    </linearGradient>

    <linearGradient id="trackpadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d283e" />
      <stop offset="100%" stop-color="#231f32" />
    </linearGradient>

    <linearGradient id="fingerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8d0f2" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a092c8" stop-opacity="0.20" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Title & Subtitle -->
  <text x="300" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">TrackPoint: Double-Tap & Hold</text>
  <text x="300" y="58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#a099bc" text-anchor="middle">Pointing Stick Activation with Finger Silhouette</text>

  <!-- Trackpad Surface -->
  <rect x="100" y="75" width="400" height="250" rx="14" fill="url(#trackpadGrad)" stroke="#453e59" stroke-width="2" filter="url(#shadow)" />

  <g class="finger">
      <!-- Finger Body Silhouette -->
      <path d="M 289 192
               C 289 180, 311 180, 311 192
               L 314 270
               L 286 270 Z"
            fill="url(#fingerGrad)" stroke="#9887c9" stroke-width="1.5" stroke-opacity="0.6" />

      <!-- Fingernail Detail -->
      <path d="M 293.4 196 C 293.4 188, 306.6 188, 306.6 196 Z"
            fill="none" stroke="#9887c9" stroke-width="1" opacity="0.5" />

      <!-- Touch Point Touch Circle & Ripple -->
      <circle cx="300" cy="180" r="12" fill="#9887c9" opacity="0.9" />
      <circle cx="300" cy="180" r="20" fill="none" stroke="#9887c9" stroke-width="1.5" opacity="0.4" />
    </g>
<text x="300" y="285" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" text-anchor="middle">Index</text>

    <circle cx="300" cy="180" r="28" fill="none" stroke="#9887c9" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="300" cy="180" r="42" fill="none" stroke="#9887c9" stroke-width="1.5" opacity="0.5" />
    <text x="300" y="305" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#9887c9" text-anchor="middle">Double-Tap &amp; Hold: One finger double tap &amp; hold</text>

</svg>