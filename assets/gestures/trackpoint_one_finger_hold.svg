<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="100%" stop-color="#110e1b" />
    </linearGradient>

    <linearGradient id="trackpadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d283e" />
      <stop offset="100%" stop-color="#231f32" />
    </linearGradient>

    <linearGradient id="fingerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8d0f2" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a092c8" stop-opacity="0.20" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Title & Subtitle -->
  <text x="300" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">TrackPoint: One-Finger Hold</text>
  <text x="300" y="58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#a099bc" text-anchor="middle">Rest One Finger Anywhere to Engage Pointing Stick</text>

  <!-- Trackpad Surface -->
  <rect x="100" y="75" width="400" height="250" rx="14" fill="url(#trackpadGrad)" stroke="#453e59" stroke-width="2" filter="url(#shadow)" />

  <!-- Hold Timer Badge -->
  <g transform="translate(300, 115)">
    <rect x="-48" y="-12" width="96" height="22" rx="11" fill="#2d283e" stroke="#c7bde7" stroke-width="1.2" opacity="0.9" />
    <circle cx="-32" cy="-1" r="5.5" fill="none" stroke="#c7bde7" stroke-width="1.2" />
    <path d="M -32 -4 L -32 -1 L -29 -1" fill="none" stroke="#c7bde7" stroke-width="1.2" stroke-linecap="round" />
    <text x="-21" y="3" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#c7bde7" text-anchor="start">Hold ~0.4s</text>
  </g>

  <!-- Omnidirectional Velocity Arrows -->
  <g stroke="#c7bde7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Up Arrow -->
    <path d="M 300 138 L 300 118" />
    <path d="M 295 124 L 300 118 L 305 124" />
    <!-- Down Arrow -->
    <path d="M 300 202 L 300 222" />
    <path d="M 295 216 L 300 222 L 305 216" />
    <!-- Left Arrow -->
    <path d="M 268 170 L 248 170" />
    <path d="M 254 165 L 248 170 L 254 175" />
    <!-- Right Arrow -->
    <path d="M 332 170 L 352 170" />
    <path d="M 346 165 L 352 170 L 346 175" />
  </g>

  <!-- Finger Body Silhouette -->
  <g class="finger">
    <path d="M 289 182
             C 289 170, 311 170, 311 182
             L 314 250
             L 286 250 Z"
          fill="url(#fingerGrad)" stroke="#c7bde7" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 293.4 186 C 293.4 178, 306.6 178, 306.6 186 Z"
          fill="none" stroke="#c7bde7" stroke-width="1" opacity="0.5" />

    <!-- Anchor Point, Ripple & Hold Timer Arc -->
    <circle cx="300" cy="170" r="13" fill="#c7bde7" opacity="0.95" />
    <circle cx="300" cy="170" r="22" fill="none" stroke="#c7bde7" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="105 35" opacity="0.8" />
    <circle cx="300" cy="170" r="30" fill="none" stroke="#c7bde7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4" />
  </g>

  <text x="300" y="268" font-family="-apple-system, sans-serif" font-size="10" fill="#a099bc" text-anchor="middle">Index</text>

  <!-- Bottom Caption -->
  <text x="300" y="306" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#c7bde7" text-anchor="middle">One-Finger Hold: Rest finger motionless to steer cursor</text>

</svg>
