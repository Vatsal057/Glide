<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="100%" stop-color="#110e1b" />
    </linearGradient>

    <linearGradient id="trackpadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d283e" />
      <stop offset="100%" stop-color="#231f32" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7bde7" />
      <stop offset="100%" stop-color="#9887c9" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />

  <!-- Title & Subtitle -->
  <text x="400" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">App Switcher 2D Spatial Navigation</text>
  <text x="400" y="66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#a099bc" text-anchor="middle">3-Finger Trackpad Gesture Controls</text>

  <!-- Trackpad Surface -->
  <rect x="180" y="90" width="440" height="280" rx="16" fill="url(#trackpadGrad)" stroke="#453e59" stroke-width="2" filter="url(#shadow)" />

  <!-- Touch Point 1 -->
  <circle cx="350" cy="230" r="14" fill="#c7bde7" opacity="0.9" />
  <circle cx="350" cy="230" r="22" fill="none" stroke="#c7bde7" stroke-width="2" opacity="0.5" />

  <!-- Touch Point 2 -->
  <circle cx="400" cy="230" r="14" fill="#c7bde7" opacity="0.9" />
  <circle cx="400" cy="230" r="22" fill="none" stroke="#c7bde7" stroke-width="2" opacity="0.5" />

  <!-- Touch Point 3 -->
  <circle cx="450" cy="230" r="14" fill="#c7bde7" opacity="0.9" />
  <circle cx="450" cy="230" r="22" fill="none" stroke="#c7bde7" stroke-width="2" opacity="0.5" />

  <!-- Horizontal Swipe Arrows (Switch Apps) -->
  <g stroke="#c7bde7" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Arrow -->
    <path d="M 310 230 L 230 230" />
    <path d="M 245 218 L 230 230 L 245 242" />
    <!-- Right Arrow -->
    <path d="M 490 230 L 570 230" />
    <path d="M 555 218 L 570 230 L 555 242" />
  </g>

  <!-- Vertical Swipe Arrows (Select Windows) -->
  <g stroke="#9887c9" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Up Arrow -->
    <path d="M 400 190 L 400 120" />
    <path d="M 388 135 L 400 120 L 412 135" />
    <!-- Down Arrow -->
    <path d="M 400 270 L 400 340" />
    <path d="M 388 325 L 400 340 L 412 325" />
  </g>

  <!-- Labels -->
  <!-- Horizontal Label -->
  <rect x="200" y="388" width="180" height="32" rx="8" fill="#2d283e" stroke="#c7bde7" stroke-width="1.5" />
  <text x="290" y="409" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#c7bde7" text-anchor="middle">↔ Horizontal: Switch Apps</text>

  <!-- Vertical Label -->
  <rect x="420" y="388" width="180" height="32" rx="8" fill="#2d283e" stroke="#9887c9" stroke-width="1.5" />
  <text x="510" y="409" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#9887c9" text-anchor="middle">↕ Vertical: Pick Window</text>

</svg>
