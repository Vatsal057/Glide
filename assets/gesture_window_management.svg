<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="100%" stop-color="#110e1b" />
    </linearGradient>

    <linearGradient id="trackpadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d283e" />
      <stop offset="100%" stop-color="#231f32" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />

  <!-- Title & Subtitle -->
  <text x="400" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Window State Ladder &amp; Controls</text>
  <text x="400" y="66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#a099bc" text-anchor="middle">Sequential Swiping for Window Actions</text>

  <!-- Left Box: 3 Fingers Minimize -->
  <g transform="translate(60, 90)">
    <rect width="310" height="280" rx="14" fill="url(#trackpadGrad)" stroke="#453e59" stroke-width="2" filter="url(#shadow)" />
    <!-- Touch Points -->
    <circle cx="125" cy="180" r="10" fill="#c7bde7" />
    <circle cx="155" cy="180" r="10" fill="#c7bde7" />
    <circle cx="185" cy="180" r="10" fill="#c7bde7" />
    <!-- Down Arrow -->
    <path d="M 155 195 L 155 240" stroke="#c7bde7" stroke-width="3" stroke-linecap="round" />
    <path d="M 145 230 L 155 240 L 165 230" stroke="#c7bde7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Window graphic -->
    <rect x="85" y="40" width="140" height="90" rx="8" fill="#1e1b2e" stroke="#c7bde7" stroke-width="2" />
    <circle cx="100" cy="52" r="4" fill="#ff5f56" />
    <circle cx="112" cy="52" r="4" fill="#ffbd2e" />
    <circle cx="124" cy="52" r="4" fill="#27c93f" />
    <text x="155" y="268" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#c7bde7" text-anchor="middle">3-Finger Swipe Down: Minimize</text>
  </g>

  <!-- Right Box: 4 Fingers Maximize -> Fullscreen -->
  <g transform="translate(430, 90)">
    <rect width="310" height="280" rx="14" fill="url(#trackpadGrad)" stroke="#453e59" stroke-width="2" filter="url(#shadow)" />
    <!-- Touch Points -->
    <circle cx="110" cy="180" r="10" fill="#9887c9" />
    <circle cx="140" cy="180" r="10" fill="#9887c9" />
    <circle cx="170" cy="180" r="10" fill="#9887c9" />
    <circle cx="200" cy="180" r="10" fill="#9887c9" />
    <!-- Up Arrow -->
    <path d="M 155 165 L 155 120" stroke="#9887c9" stroke-width="3" stroke-linecap="round" />
    <path d="M 145 130 L 155 120 L 165 130" stroke="#9887c9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Window graphic -->
    <rect x="85" y="30" width="140" height="75" rx="6" fill="#1e1b2e" stroke="#9887c9" stroke-width="2" />
    <circle cx="98" cy="42" r="3.5" fill="#ff5f56" />
    <circle cx="108" cy="42" r="3.5" fill="#ffbd2e" />
    <circle cx="118" cy="42" r="3.5" fill="#27c93f" />
    <text x="155" y="252" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#9887c9" text-anchor="middle">4-Finger Swipe Up: Maximize</text>
    <text x="155" y="268" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#a099bc" text-anchor="middle">Swipe Up Again: Fullscreen</text>
  </g>

</svg>
